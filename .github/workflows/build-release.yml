name: Build capture fix

on:
  workflow_dispatch:
  push:
    branches:
      - build/portal-1.11

permissions:
  contents: write

concurrency:
  group: capture-fix-v1.1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify portal 1.11.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out build sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test installation and recovery
        run: python3 -m unittest discover -s tests -v

      - name: Prepare Ubuntu 24.04 build environment
        run: docker build --file build/Containerfile --tag cosmic-capture-builder .

      - name: Build pinned source and verify frame ordering
        shell: bash
        run: |
          mkdir output
          docker run --rm --memory=12g --cpus="$(nproc)" \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/capture-build-home \
            --env CARGO_HOME=/tmp/capture-build-cargo \
            --env CARGO_BUILD_JOBS="$(nproc)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/input,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/output,dst=/out" \
            cosmic-capture-builder python3 /input/build/build.py

      - name: Prepare matching installers and release files
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 build/prepare-release.py --output output --repository "$RELEASE_REPOSITORY"

      - name: Save verified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capture-fix-v1.1.0
          path: output/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Stage draft release and installer update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/stage-release.py
